version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 13 1,15 * *"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 13 1,15 * *"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/cf-custom-resources"
    schedule:
      interval: cron
      cronjob: "0 13 1,15 * *"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      custom-resource-dependencies:
        patterns:
          - "*"

  # The sidecar app is an E2E fixture; its npm dependencies are not maintained by Dependabot.
  - package-ecosystem: npm
    directory: "/e2e/sidecars/hello"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
