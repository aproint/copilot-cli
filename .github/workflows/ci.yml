name: ci

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.classify.outputs.full }}
      go: ${{ steps.classify.outputs.go }}
      js: ${{ steps.classify.outputs.js }}
      license: ${{ steps.classify.outputs.license }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Find changed paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.sha || github.event.merge_group.head_sha }}
        run: |
          git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"

      - name: Select checks
        id: classify
        run: python3 scripts/ci_changes.py "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"

  build-linux:
    name: build (compile-linux)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.js == 'true') }}
    runs-on: ubuntu-24.04
    env:
      BUILD_COMMAND: compile-linux
    steps: &build_steps
      - name: Require successful change detection
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "Change detection failed; CI cannot skip checks." >&2
          exit 1

      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Cache Go dependencies and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-build-${{ env.BUILD_COMMAND }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-build-${{ env.BUILD_COMMAND }}-

      - name: Download Go modules
        run: make download-go-modules

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Package custom resources
        run: make package-custom-resources

      - name: Build binaries
        run: make "$BUILD_COMMAND"

      - name: Cleanup
        run: make package-custom-resources-clean

  build-windows:
    name: build (compile-windows)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'merge_group' && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.js == 'true') }}
    runs-on: ubuntu-24.04
    env:
      BUILD_COMMAND: compile-windows
    steps: *build_steps

  build-darwin:
    name: build (compile-darwin)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'merge_group' && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.js == 'true') }}
    runs-on: ubuntu-24.04
    env:
      BUILD_COMMAND: compile-darwin
    steps: *build_steps

  mocks:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Cache Go dependencies and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-mocks-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-mocks-

      - name: Download Go modules
        run: make download-go-modules

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Generate mocks
        run: make gen-mocks

      - name: Print out local diff after mockgen
        run: |
          git status --porcelain=v1 1>gitstatus.txt
          cat gitstatus.txt

      - name: Check for nonzero diff
        run: '[ -z "$(cat gitstatus.txt)" ] && echo "Generated mocks all match"'

  go-unit-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Cache Go dependencies and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-unit-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-unit-

      - name: Download Go modules
        run: make download-go-modules

      - name: Run Go unit tests
        run: make run-unit-test

      # - name: Upload Go coverage report to Codecov
      #   uses: codecov/codecov-action@v7
      #   with:
      #     files: ./coverage.out

  security-go:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version

      - name: Scan Go dependencies
        run: make security-go

  security-js:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.js == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Scan custom resource dependencies
        run: make security-js

  js-unit-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.js == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Run custom resource unit tests
        run: make custom-resource-tests

      # - name: Upload Node coverage report to Codecov
      #   uses: codecov/codecov-action@v7
      #   with:
      #     directory: cf-custom-resources/

  js-lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.js == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Run custom resource lint
        run: make custom-resource-lint

  local-integration-tests:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'merge_group' && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.js == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Cache Go dependencies and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-local-integration-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-local-integration-

      - name: Download Go modules
        run: make download-go-modules

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Run local integration tests
        run: make local-integration-test

  license:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.license == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run license check
        run: ./scripts/license.sh .
