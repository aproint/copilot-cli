AWSTemplateFormatVersion: '2010-09-09'
Description: CodePipeline for phonetool
Metadata:
    Version: v1.28.0
Resources:
    BuildProjectRole:
        Type: AWS::IAM::Role
        Properties:
            Path: /
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                        Service:
                            - codebuild.amazonaws.com
                      Action:
                        - sts:AssumeRole
            ManagedPolicyArns:
                - 'arn:aws:iam::aws:policy/AmazonSSMReadOnlyAccess' # for env ls
                - 'arn:aws:iam::aws:policy/AWSCloudFormationReadOnlyAccess' # for service package
            Policies:
                - PolicyName: assume-env-manager
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                        - Effect: Allow
                          Resource: 'arn:aws:iam::111122223333:role/phonetool-test-EnvManagerRole'
                          Action:
                            - sts:AssumeRole
                        - Effect: Allow
                          Resource: 'arn:aws:iam::444455556666:role/phonetool-prod-EnvManagerRole'
                          Action:
                            - sts:AssumeRole
    BuildProjectPolicy:
        Type: AWS::IAM::Policy
        DependsOn: BuildProjectRole
        Properties:
            PolicyName: !Sub ${AWS::StackName}-CodeBuildPolicy
            Roles:
                - !Ref BuildProjectRole
            PolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Action:
                        - codebuild:CreateReportGroup
                        - codebuild:CreateReport
                        - codebuild:UpdateReport
                        - codebuild:BatchPutTestCases
                        - codebuild:BatchPutCodeCoverages
                      Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/pipeline-phonetool-*
                    - Effect: Allow
                      Action:
                        - s3:PutObject
                        - s3:GetObject
                        - s3:GetObjectVersion
                      # TODO: This might not be necessary. We may only need the bucket
                      # that is in the same region as the pipeline.
                      # Loop through all the artifact buckets created in the stackset
                      Resource:
                        - !Join ['', ['arn:aws:s3:::', 'phonetool-artifacts-west']]
                        - !Join ['', ['arn:aws:s3:::', 'phonetool-artifacts-west', '/*']]
                        - !Join ['', ['arn:aws:s3:::', 'phonetool-artifacts-east']]
                        - !Join ['', ['arn:aws:s3:::', 'phonetool-artifacts-east', '/*']]
                    - Effect: Allow
                      Action:
                        # TODO: scope this down if possible
                        - kms:*
                      # TODO: This might not be necessary. We may only need the KMS key
                      # that is in the same region as the pipeline.
                      # Loop through all the KMS keys used to en/decrypt artifacts
                      # across (cross-regional) pipeline stages, with each stage
                      # backed by a (regional) S3 bucket.
                      Resource:
                        - arn:aws:kms:us-west-2:111122223333:key/west
                        - arn:aws:kms:us-east-1:444455556666:key/east
                    - Effect: Allow
                      Action:
                        - logs:CreateLogGroup
                        - logs:CreateLogStream
                        - logs:PutLogEvents
                      Resource: arn:aws:logs:*:*:*
                    - Effect: Allow
                      Action:
                        - ecr:GetAuthorizationToken
                      Resource: '*'
                    - Effect: Allow
                      Action:
                        - ecr:DescribeImageScanFindings
                        - ecr:GetLifecyclePolicyPreview
                        - ecr:GetDownloadUrlForLayer
                        - ecr:BatchGetImage
                        - ecr:DescribeImages
                        - ecr:ListTagsForResource
                        - ecr:BatchCheckLayerAvailability
                        - ecr:GetLifecyclePolicy
                        - ecr:GetRepositoryPolicy
                        - ecr:PutImage
                        - ecr:InitiateLayerUpload
                        - ecr:UploadLayerPart
                        - ecr:CompleteLayerUpload
                      Resource: '*'
                      Condition: {StringEquals: {'ecr:ResourceTag/copilot-application': phonetool}}
    BuildProject:
        Type: AWS::CodeBuild::Project
        Properties:
            Name: !Sub ${AWS::StackName}-BuildProject
            Description: !Sub Build for ${AWS::StackName}
            # ArtifactKey is the KMS key ID or ARN that is used with the artifact bucket
            # created in the same region as this pipeline.
            EncryptionKey: !ImportValue phonetool-ArtifactKey
            ServiceRole: !GetAtt BuildProjectRole.Arn
            Artifacts:
                Type: CODEPIPELINE
            Cache:
                Modes:
                    - LOCAL_DOCKER_LAYER_CACHE
                Type: LOCAL
            Environment:
                Type: LINUX_CONTAINER
                ComputeType: BUILD_GENERAL1_SMALL
                PrivilegedMode: true
                Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
                EnvironmentVariables:
                    - Name: AWS_ACCOUNT_ID
                      Value: !Sub '${AWS::AccountId}'
                    - Name: PARTITION
                      Value: !Ref AWS::Partition
            Source:
                Type: CODEPIPELINE
                BuildSpec: copilot/pipelines/phonetool-pipeline/buildspec.yml
            TimeoutInMinutes: 60
    BuildTestCommandstest:
        Type: AWS::CodeBuild::Project
        Properties:
            EncryptionKey: !ImportValue phonetool-ArtifactKey
            ServiceRole: !GetAtt BuildProjectRole.Arn
            Artifacts:
                Type: NO_ARTIFACTS
            Environment:
                Type: LINUX_CONTAINER
                Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
                ComputeType: BUILD_GENERAL1_SMALL
                PrivilegedMode: true
            Source:
                Type: NO_SOURCE
                BuildSpec: |
                    version: 0.2
                    phases:
                      build:
                        commands:
                          - go test ./...
