name: homebrew

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish to the Homebrew tap, for example v0.0.0-rc.1.
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Release tag to publish to the Homebrew tap.
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_APP_PRIVATE_KEY:
        required: true

jobs:
  update-formula:
    if: github.repository == 'aproint/copilot-cli'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release templates
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: release
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release version must be a v-prefixed semver tag, got: $VERSION" >&2
            exit 2
          fi

          curl -fsSL "https://github.com/aproint/copilot-cli/releases/download/${VERSION}/SHA256SUMS" -o SHA256SUMS

          darwin_arm64_sha="$(awk '$2 == "copilot-darwin-arm64" { print $1 }' SHA256SUMS)"
          darwin_amd64_sha="$(awk '$2 == "copilot-darwin-amd64" { print $1 }' SHA256SUMS)"
          linux_arm64_sha="$(awk '$2 == "copilot-linux-arm64" { print $1 }' SHA256SUMS)"
          linux_amd64_sha="$(awk '$2 == "copilot-linux-amd64" { print $1 }' SHA256SUMS)"

          if [ -z "$darwin_arm64_sha" ] || [ -z "$darwin_amd64_sha" ] || [ -z "$linux_arm64_sha" ] || [ -z "$linux_amd64_sha" ]; then
            echo "SHA256SUMS is missing required Homebrew release assets" >&2
            cat SHA256SUMS >&2
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "formula_version=${VERSION#v}"
            echo "darwin_arm64_sha=$darwin_arm64_sha"
            echo "darwin_amd64_sha=$darwin_amd64_sha"
            echo "linux_arm64_sha=$linux_arm64_sha"
            echo "linux_amd64_sha=$linux_amd64_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Create Homebrew tap token
        id: tap-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: aproint
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: aproint/homebrew-tap
          path: homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}

      - name: Update formula
        env:
          VERSION: ${{ steps.release.outputs.version }}
          FORMULA_VERSION: ${{ steps.release.outputs.formula_version }}
          DARWIN_ARM64_SHA: ${{ steps.release.outputs.darwin_arm64_sha }}
          DARWIN_AMD64_SHA: ${{ steps.release.outputs.darwin_amd64_sha }}
          LINUX_ARM64_SHA: ${{ steps.release.outputs.linux_arm64_sha }}
          LINUX_AMD64_SHA: ${{ steps.release.outputs.linux_amd64_sha }}
        shell: bash
        run: |
          mkdir -p homebrew-tap/Formula
          sed \
            -e "s|@VERSION@|$VERSION|g" \
            -e "s|@FORMULA_VERSION@|$FORMULA_VERSION|g" \
            -e "s|@DARWIN_ARM64_SHA@|$DARWIN_ARM64_SHA|g" \
            -e "s|@DARWIN_AMD64_SHA@|$DARWIN_AMD64_SHA|g" \
            -e "s|@LINUX_ARM64_SHA@|$LINUX_ARM64_SHA|g" \
            -e "s|@LINUX_AMD64_SHA@|$LINUX_AMD64_SHA|g" \
            scripts/release/homebrew/copilot-cli.rb.in > homebrew-tap/Formula/copilot-cli.rb

      - name: Validate formula
        working-directory: homebrew-tap
        run: |
          ruby -c Formula/copilot-cli.rb
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew style Formula/copilot-cli.rb

      - name: Open tap pull request
        uses: peter-evans/create-pull-request@v8
        with:
          path: homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          commit-message: "chore: upgrade copilot-cli to ${{ steps.release.outputs.version }}"
          committer: "aproint-tap-manager[bot] <301659119+aproint-tap-manager[bot]@users.noreply.github.com>"
          author: "aproint-tap-manager[bot] <301659119+aproint-tap-manager[bot]@users.noreply.github.com>"
          sign-commits: true
          title: "chore: upgrade copilot-cli to ${{ steps.release.outputs.version }}"
          body: "Created by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          branch: upgrade-copilot-${{ steps.release.outputs.version }}
          delete-branch: true
