    PipelineRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                        Service:
                            - codepipeline.amazonaws.com
                      Action:
                        - sts:AssumeRole
            Path: /
    PipelineRolePolicy:
        Type: AWS::IAM::Policy
        Properties:
            PolicyName: !Sub ${AWS::StackName}-CodepipelinePolicy
            PolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Action:
                        - codepipeline:*
                        - codecommit:GetBranch
                        - codecommit:GetCommit
                        - codecommit:UploadArchive
                        - codecommit:GetUploadArchiveStatus
                        - codecommit:CancelUploadArchive
                        - iam:ListRoles
                        - cloudformation:Describe*
                        - cloudFormation:List*
                        - codebuild:BatchGetBuilds
                        - codebuild:StartBuild
                        - cloudformation:CreateStack
                        - cloudformation:DeleteStack
                        - cloudformation:DescribeStacks
                        - cloudformation:UpdateStack
                        - cloudformation:CreateChangeSet
                        - cloudformation:DeleteChangeSet
                        - cloudformation:DescribeChangeSet
                        - cloudformation:ExecuteChangeSet
                        - cloudformation:SetStackPolicy
                        - cloudformation:ValidateTemplate
                        - iam:PassRole
                        - s3:ListAllMyBuckets
                        - s3:GetBucketLocation
                      Resource:
                        - "*"
                    - Effect: Allow
                      Action:
                        - codestar-connections:CreateConnection
                        - codestar-connections:DeleteConnection
                        - codestar-connections:GetConnection
                        - codestar-connections:ListConnections
                        - codestar-connections:GetIndividualAccessToken
                        - codestar-connections:GetInstallationUrl
                        - codestar-connections:ListInstallationTargets
                        - codestar-connections:StartOAuthHandshake
                        - codestar-connections:UpdateConnectionInstallation
                        - codestar-connections:UseConnection
                        - codestar-connections:RegisterAppCode
                        - codestar-connections:StartAppRegistrationHandshake
                        - codestar-connections:StartUploadArchiveToS3
                        - codestar-connections:GetUploadArchiveToS3Status
                        - codestar-connections:PassConnection
                        - codestar-connections:PassedToService
                      Resource:
                        - arn:aws:codestar-connections:us-west-2:111122223333:connection/12345678-1234-1234-1234-123456789012
                    - Effect: Allow
                      Action:
                        - kms:Decrypt
                        - kms:Encrypt
                        - kms:GenerateDataKey
                      Resource:
                        - arn:aws:kms:us-west-2:111122223333:key/west
